{% extends "base.html" %}

{% block content %}
<div class="home-page">
  <section class="card">
    <div class="section-title">
      <span class="title-icon">📍</span>
      <h2>避難所マップ</h2>
    </div>
    <div class="map-wrap">
      <div id="shelterMap"></div>
    </div>
  </section>

  <section class="card">
    <div class="weather-header">
      <div class="section-title" style="padding-bottom:0;">
        <span class="title-icon">⛅</span>
        <h2>青森市 気象警報・注意報</h2>
      </div>
      <button class="refresh-button" type="button" id="refreshWeather">⟳ 10分おき自動更新</button>
    </div>

    <div id="weatherContent">
      <p class="loading">読み込み中...</p>
    </div>
  </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const weatherContent = document.getElementById('weatherContent');
    const refreshButton = document.getElementById('refreshWeather');

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
                weatherContent.innerHTML = '<p class="loading">気象情報の取得に失敗しました</p>';
            });
    }

    function updateWeatherContent(data) {
        if (data.error) {
            weatherContent.innerHTML = '<p class="loading">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = `
                <div class="weather-status weather-safe">
                  <span class="status-badge">✓</span>
                  <span>現在、警報・注意報は発表されていません</span>
                </div>
            `;
        }

        weatherContent.innerHTML = `
            <div class="weather-status">
              <span class="status-tick">●</span>
              <span>${data.area_name || '青森市'}</span>
            </div>
            ${warningsHtml}
            <div class="weather-row"><span class="icon">◌</span><span>データ取得時刻: ${data.last_fetch_time || '更新中...'}</span></div>
            <div class="weather-row"><span class="icon">◔</span><span>気象庁最終発表: ${data.report_time || '不明'}</span></div>
        `;
    }

    refreshButton.addEventListener('click', updateWeatherWarnings);
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
