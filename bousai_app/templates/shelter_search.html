{% extends "base.html" %}

{% block title %}防災アプリ（避難所検索画面）{% endblock %}
{% block header_title %}防災アプリ（避難所検索画面）{% endblock %}

{% block content %}
<style>
  .page-shell {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  main {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .search-shell {
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 18px;
    align-items: stretch;
    height: calc(100vh - 76px);
    max-height: calc(100vh - 76px);
    padding: 18px;
    box-sizing: border-box;
  }

  .map-panel {
    background: rgba(252, 253, 254, 0.85);
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 16px rgba(12, 79, 141, 0.06);
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .search-panel {
    flex: 1 1 0;
    min-width: 0;
    padding: 18px;
    background: rgba(252, 253, 254, 0.85);
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(12, 79, 141, 0.06);
  }

  .search-panel h3 {
    margin: 0 0 18px;
    color: #16466d;
    font-size: 1rem;
    letter-spacing: 0.04em;
  }

  .search-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 106px;
    gap: 12px 16px;
    align-items: start;
  }

  .field {
    min-width: 0;
  }

  .field label {
    display: none;
  }

  .field input,
  .field select {
    width: 100%;
    height: 38px;
    border: 1px solid #b7c8d6;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.82rem;
    background: #fff;
    color: #1f2b3a;
    box-sizing: border-box;
  }

  .field input:focus,
  .field select:focus {
    outline: 2px solid rgba(13, 115, 215, 0.2);
    border-color: #0d73d7;
  }

  .search-btn {
    width: 106px;
    height: 38px;
    border: 1px solid #0d73d7;
    border-radius: 8px;
    background: #0d73d7;
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }

  .search-note {
    margin: 0 0 12px 35px;
    color: #526474;
    font-size: 0.78rem;
    line-height: 1.25;
  }

  .search-note strong {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-right: 8px;
    color: #a52b24;
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    line-height: 1;
    pointer-events: none;
  }

  .search-note strong::before {
    content: "!";
    display: inline-grid;
    place-items: center;
    width: 17px;
    height: 17px;
    border: 2px solid #c64a41;
    border-radius: 50%;
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0;
  }

  .search-note span {
    color: #526474;
  }

  .search-note::after {
    content: "↓  選択肢へ";
    display: block;
    margin: 5px 0 0 4px;
    color: #397da9;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .search-guide {
    grid-column: 1 / -1;
    min-height: 620px;
    margin-top: 4px;
    border: 1px solid #c7d8e5;
    border-radius: 12px;
    background: #f7fbfe;
    padding: 14px 12px 12px;
    position: relative;
    box-shadow: inset 0 3px 0 #397da9;
  }

  .search-guide > .search-note {
    position: relative;
    z-index: 1;
  }

  .guide-person {
    position: absolute;
    left: 12px;
    top: 17px;
    width: 25px;
    height: 31px;
  }

  .guide-person::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #555;
  }

  .guide-person::after {
    content: "";
    position: absolute;
    left: 2px;
    bottom: 0;
    width: 23px;
    height: 17px;
    border-radius: 13px 13px 5px 5px;
    background: #555;
  }

  .guide-balloon {
    margin-left: 35px;
    width: calc(100% - 55px);
    min-height: 40px;
    padding: 9px 12px;
    border: 1px solid #a9bdca;
    border-radius: 5px 14px 14px 14px;
    background: #fff;
    box-shadow: 0 3px 8px rgba(32, 67, 91, 0.08);
    color: #28465d;
    font-size: 0.72rem;
    line-height: 1.2;
    text-align: center;
    position: relative;
  }

  .guide-balloon::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 12px;
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-right: 8px solid #a9bdca;
  }

  .guide-balloon::after {
    content: "";
    position: absolute;
    left: -6px;
    top: 13px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 7px solid #fff;
  }

  .guide-messages {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    width: calc(100% - 55px);
    padding-right: 4px;
    margin-left: 35px;
  }

  .guide-messages .guide-balloon {
    width: 100%;
    margin-left: 0;
    text-align: center;
  }

  .guide-message-row {
    display: flex;
    justify-content: flex-end;
  }

  .guide-message {
    max-width: 82%;
    padding: 8px 10px;
    border: 1px solid #8bc2a0;
    border-radius: 12px 12px 3px 12px;
    background: linear-gradient(180deg, #dbf5e2 0%, #cfeeda 100%);
    color: #24553a;
    font-size: 0.72rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 6px rgba(64, 120, 83, 0.08);
  }

  .guide-actions {
    position: static;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    padding: 12px;
    margin: 0 0 14px;
    border: 1px solid #b6d0e0;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
  }

  .guide-action {
    min-height: 38px;
    border: 2px solid #79a9c9;
    border-radius: 8px;
    background: #fff;
    color: #16466d;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 5px 3px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .guide-action:hover,
  .guide-action:focus-visible {
    border-color: #0d73d7;
    background: #edf7ff;
    transform: translateY(-1px);
    outline: none;
  }

  .guide-action.is-selected {
    background: #e1eff9;
    border-color: #397da9;
    color: #174d70;
    font-weight: 700;
  }

  .search-btn:hover {
    filter: brightness(0.96);
  }

  .map-wrap {
    position: relative;
    flex: 1 1 auto;
    height: 100%;
    min-height: 300px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(15, 93, 175, 0.15);
    background: #dfeefb;
  }

  #shelterMap {
    width: 100%;
    height: 100%;
  }

  .map-zoom {
    position: absolute;
    left: 16px;
    top: 16px;
    z-index: 500;
    background: rgba(255,255,255,0.82);
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    border: 1px solid rgba(13, 94, 175, 0.08);
  }

  .map-zoom button {
    display: block;
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: #1d2f42;
    font-size: 2rem;
    cursor: pointer;
  }

  .map-zoom button + button {
    border-top: 1px solid rgba(15, 23, 42, 0.08);
  }

  .results-panel {
    background: #ffffff;
    border: 1px solid #d9dde4;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    padding: 24px;
    margin: 18px;
  }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .results-count {
    font-size: 0.96rem;
    color: #4b5563;
  }

  .results-table-wrap {
    overflow-x: auto;
  }

  table.result-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.result-table th,
  table.result-table td {
    border: 1px solid #d9dde4;
    padding: 10px 8px;
    text-align: left;
    vertical-align: top;
    word-break: break-word;
  }

  table.result-table th {
    background: #eff6ff;
    font-size: 0.92rem;
  }

  table.result-table td {
    background-color: #ffffff;
  }

  .result-note {
    margin-top: 12px;
    font-size: 0.92rem;
    color: #4b5563;
  }

  .status-pill {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #1f2937;
    background: #e5e7eb;
  }

  .status-pill--low {
    background: #fce7e7;
    color: #b42318;
  }

  .status-pill--mid {
    background: #fff7d6;
    color: #8a5c00;
  }

  .status-pill--high {
    background: #eaf6ee;
    color: #186a3b;
  }

  @media (max-width: 680px) {
    .search-shell {
      flex-direction: column;
      min-height: auto;
      padding: 12px;
    }

    .map-panel,
    .search-panel {
      width: 100%;
      flex-basis: auto;
    }

    .map-wrap {
      height: min(45vh, 360px);
      min-height: 240px;
    }

    .search-guide {
      height: min(70vh, 620px);
      min-height: 420px;
    }

    .results-panel {
      margin: 12px;
    }
  }
</style>

<div class="search-shell">
  <div class="map-panel">
    <div class="map-wrap">
      <div class="map-zoom" aria-label="ズームボタン">
        <button type="button" aria-label="拡大" data-action="in">＋</button>
        <button type="button" aria-label="縮小" data-action="out">－</button>
      </div>
      <div id="shelterMap"></div>
    </div>
  </div>

  <aside class="search-panel">
    <h3>避難所検索</h3>
    <p class="search-note"><strong>緊急時はこちら</strong><span>避難所を選んだ基準の順に表示します</span></p>
    <form class="search-form" method="get" action="/search_results">
      <div class="field">
        <label for="sort">表示基準</label>
        <select id="sort" name="sort" aria-label="避難所の表示基準">
          <option value="">▼ 選択してください</option>
          <option value="distance" {% if sort == 'distance' %}selected{% endif %}>避難所までの距離が近い順</option>
          <option value="occupancy" {% if sort == 'occupancy' %}selected{% endif %}>空き率が高い順</option>
          <option value="facilities" {% if sort == 'facilities' %}selected{% endif %}>設備が良い順</option>
        </select>
      </div>

      <button class="search-btn" type="submit">検索ボタン</button>

      <div class="search-guide">
        <div class="guide-person" aria-hidden="true"></div>
        <div class="guide-actions">
          <button class="guide-action" type="button" data-condition="distance">家からの距離</button>
          <button class="guide-action" type="button" data-condition="gender">男女比</button>
          <button class="guide-action" type="button" data-condition="facilities">設備</button>
          <button class="guide-action" type="button" data-condition="occupancy">現在の収容者数</button>
        </div>
        <div class="guide-messages" id="guideMessages" aria-live="polite"></div>
        <input type="hidden" name="conditions" id="conditions" value="{{ conditions|join(',') if conditions else '' }}" />
      </div>
    </form>
  </aside>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const sheltersData = {{ results | tojson | safe }};
    const mapEl = document.getElementById('shelterMap');
    const form = document.querySelector('.search-form');
    const sortSelect = document.getElementById('sort');
    const conditionsInput = document.getElementById('conditions');
    const guideMessages = document.getElementById('guideMessages');
    const conditionButtons = Array.from(document.querySelectorAll('.guide-action'));

    if (!mapEl) {
      return;
    }

    const map = L.map('shelterMap', {
      zoomControl: false,
      attributionControl: false
    }).setView([40.823, 140.745], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const disasterMarkerLayer = L.layerGroup().addTo(map);
    let disasterMarkers = [];

    function getDisasterScaleColor(scale) {
      if (scale === '小規模') return '#facc15';
      if (scale === '中規模') return '#f97316';
      if (scale === '大規模') return '#ef4444';
      return '#0d5c96';
    }

    function getDisasterScaleSize(scale) {
      if (scale === '小規模') return 26;
      if (scale === '中規模') return 34;
      if (scale === '大規模') return 50;
      return 26;
    }

    function buildDisasterIcon(scale, zoom) {
      const baseSize = getDisasterScaleSize(scale);
      const zoomScale = Math.pow(1.12, zoom - 12);
      const size = Math.round(baseSize * Math.max(0.65, Math.min(1.6, zoomScale)));
      const color = getDisasterScaleColor(scale);

      return L.divIcon({
        className: 'map-disaster-icon',
        html: '<span class="map-disaster-shape" style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';border-color:' + color + ';" aria-hidden="true"></span>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2]
      });
    }

    function renderDisasterMarkers(markers) {
      disasterMarkerLayer.clearLayers();

      if (!Array.isArray(markers)) {
        return;
      }

      markers.forEach(function (marker) {
        if (!marker || marker.latitude === undefined || marker.longitude === undefined) {
          return;
        }

        const scale = marker.scale || '小規模';
        const icon = buildDisasterIcon(scale, map.getZoom());
        const disasterMarker = L.marker([marker.latitude, marker.longitude], {
          icon: icon
        }).addTo(disasterMarkerLayer);

        disasterMarker.bindPopup(
          '<div style="font-size:0.95rem; line-height:1.5;">' +
            '<strong>' + (marker.name || '災害情報') + '</strong><br>' +
            '住所: ' + (marker.address || '未取得') + '<br>' +
            '日時: ' + (marker.datetime || '未入力') + '<br>' +
            '事項: ' + (marker.note || '未入力') +
          '</div>'
        );
      });
    }

    function loadDisasterMarkers() {
      fetch('/api/disaster_markers')
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          disasterMarkers = Array.isArray(data) ? data : [];
          renderDisasterMarkers(disasterMarkers);
        })
        .catch(function (error) {
          console.error('災害マーカーの取得に失敗しました:', error);
        });
    }

    function getColorByRemainingRate(rate) {
      if (rate <= 30) return '#d32f2f';
      if (rate <= 70) return '#f4b400';
      return '#2e7d32';
    }

    const filterValidMarkers = sheltersData.filter(function (shelter) {
      return shelter && shelter.lat !== undefined && shelter.lng !== undefined && shelter.lat !== null && shelter.lng !== null;
    });

    filterValidMarkers.forEach(function (shelter) {
      const capacity = Number(shelter.capacity || 0);
      const current = Number(shelter.current || 0);
      const remaining = Math.max(capacity - current, 0);
      const rate = capacity ? Math.round((remaining / capacity) * 100) : 0;

      const pinHtml = '<span class="shelter-pin-marker" style="background-color: ' + getColorByRemainingRate(rate) + ';"></span>';
      const markerIcon = L.divIcon({
        className: 'shelter-pin-icon',
        html: pinHtml,
        iconSize: [28, 36],
        iconAnchor: [14, 36],
        popupAnchor: [0, -32]
      });

      const marker = L.marker([shelter.lat, shelter.lng], { icon: markerIcon }).addTo(markerLayer);
      marker.bindPopup(
        '<strong>' + (shelter.name || '避難所') + '</strong><br>' +
        '最大受け入れ可能人数: ' + capacity + '人<br>' +
        '現在の受け入れ人数: ' + current + '人<br>' +
        '残り人数: ' + remaining + '人'
      );
      marker.bindTooltip(shelter.name || '避難所', { direction: 'top', opacity: 0.95 });
    });

    if (filterValidMarkers.length > 0) {
      const bounds = L.latLngBounds(filterValidMarkers.map(function (shelter) {
        return [shelter.lat, shelter.lng];
      }));
      map.fitBounds(bounds, { padding: [20, 20] });
    }

    function getConditionLabel(condition) {
      return condition === 'distance'
        ? '家からの距離'
        : condition === 'gender'
          ? '男女比'
          : condition === 'facilities'
            ? '設備'
            : condition === 'occupancy'
              ? '現在の収容者数'
              : condition;
    }

    function addQuestionBubble(text) {
      const prompt = document.createElement('div');
      prompt.className = 'guide-balloon';
      prompt.textContent = text;
      guideMessages.appendChild(prompt);
    }

    function addAnswerBubble(text) {
      const row = document.createElement('div');
      row.className = 'guide-message-row';

      const message = document.createElement('div');
      message.className = 'guide-message';
      message.textContent = text;

      row.appendChild(message);
      guideMessages.appendChild(row);
    }

    function syncHistory() {
      const currentConditions = Array.from(new Set((conditionsInput.value || '').split(',').map(function (value) {
        return value.trim();
      }).filter(Boolean)));

      guideMessages.innerHTML = '';

      if (currentConditions.length === 0) {
        addQuestionBubble('最も重視する条件は何ですか？');
      } else {
        currentConditions.forEach(function (condition, index) {
          addQuestionBubble(index === 0
            ? '最も重視する条件は何ですか？'
            : '次に求めることは何ですか？');
          addAnswerBubble(getConditionLabel(condition));
        });

        if (currentConditions.length < conditionButtons.length) {
          addQuestionBubble('次に求めることは何ですか？');
        } else {
          addQuestionBubble('条件を選択しました');
        }
      }

      conditionButtons.forEach(function (button) {
        const condition = button.dataset.condition;
        const isSelected = currentConditions.includes(condition);
        button.disabled = isSelected;
        button.hidden = isSelected;
        button.classList.toggle('is-selected', isSelected);
      });
    }

    conditionButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        const condition = button.dataset.condition;
        if (!condition) {
          return;
        }

        const currentConditions = Array.from(new Set((conditionsInput.value || '').split(',').map(function (value) {
          return value.trim();
        }).filter(Boolean)));

        if (currentConditions.includes(condition)) {
          return;
        }

        currentConditions.push(condition);
        conditionsInput.value = currentConditions.join(',');
        syncHistory();

        if (currentConditions.length >= conditionButtons.length) {
          const params = new URLSearchParams();
          params.set('conditions', currentConditions.join(','));
          if (sortSelect.value) {
            params.set('sort', sortSelect.value);
          }
          window.location.href = '/search_results?' + params.toString();
        }
      });
    });

    document.querySelectorAll('.map-zoom button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.action === 'in') map.zoomIn();
        else map.zoomOut();
      });
    });

    map.on('zoomend', function () {
      renderDisasterMarkers(disasterMarkers);
    });

    loadDisasterMarkers();
    setInterval(loadDisasterMarkers, 5000);
    syncHistory();
  });
</script>
{% endblock %}
