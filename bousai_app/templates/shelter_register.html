{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p>{{ message }}</p>
{% endif %}

{% if error %}
  <p style="color: #c43d31; font-weight: 700;">{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p>
    <label for="capacity">受け入れ可能人数</label><br>
    <input type="number" id="capacity" name="capacity" min="0" value="0">
  </p>
  <p>
    <label for="current">現在の受け入れ人数</label><br>
    <input type="number" id="current" name="current" min="0" value="0">
  </p>
  <p>
    <button type="submit" style="display: inline-block; padding: 16px 32px; border: none; border-radius: 12px; background: linear-gradient(135deg, #1f8fe5 0%, #1167b1 100%); color: #ffffff; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(17, 103, 177, 0.25); min-width: 180px;">登録</button>
  </p>
</form>

<div style="margin-top: 32px;">
  <h3>すぐ移動</h3>
  <p style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px;">
    <a href="/" style="display: inline-block; padding: 16px 24px; border-radius: 12px; background: #0d5c96; color: white; text-decoration: none; font-weight: 700; font-size: 1rem; min-width: 180px; text-align: center;">ホーム</a>
    <a href="/shelter_search" style="display: inline-block; padding: 16px 24px; border-radius: 12px; background: #2cac72; color: white; text-decoration: none; font-weight: 700; font-size: 1rem; min-width: 180px; text-align: center;">避難所検索</a>
    <a href="/board" style="display: inline-block; padding: 16px 24px; border-radius: 12px; background: #4b5563; color: white; text-decoration: none; font-weight: 700; font-size: 1rem; min-width: 180px; text-align: center;">発信画面</a>
  </p>
</div>
{% endblock %}
